name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ }

          if (-not $candidates) {
            choco install innosetup --yes --no-progress
          }

      - name: Build exe, portable and installer
        shell: pwsh
        run: .\build.ps1 -SkipInstall -PythonExe python

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = "dist\IPActivityAuditor.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing $exe"
          }
          $setup = Get-ChildItem -LiteralPath "dist" -Filter "IPActivityAuditor-Setup-*.exe"
          $portable = Get-ChildItem -LiteralPath "dist" -Filter "IPActivityAuditor-portable-*.zip"
          if (-not $setup) { throw "Missing installer" }
          if (-not $portable) { throw "Missing portable zip" }
          Get-ChildItem -LiteralPath "dist" | Format-Table Name, Length, LastWriteTime -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPActivityAuditor-windows
          path: |
            dist/IPActivityAuditor.exe
            dist/IPActivityAuditor-Setup-*.exe
            dist/IPActivityAuditor-portable-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IPActivityAuditor.exe
            dist/IPActivityAuditor-Setup-*.exe
            dist/IPActivityAuditor-portable-*.zip
          generate_release_notes: true
